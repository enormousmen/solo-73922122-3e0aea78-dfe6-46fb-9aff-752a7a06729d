services:
  preview:
    build: .
    image: preview-batch-demo:latest
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      TRANSCODE_SLOTS: "2"
      SLOW_AFTER_SECONDS: "2.0"
      SLOW_READRATE: "0.4"
      # 演示开关：让每次产物完整性探测人为变慢（秒）。探测期间页面查询、
      # 新批次派发与槽位回收都不应停住。正式使用设为 "0" 或删除该行。
      PROBE_STALL_SECONDS: "6"
    volumes:
      - preview-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  preview-data:
